# Package without publishing; Marketplace publication uses the exact reviewed archive.
name: Package release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm build
      - run: node scripts/package.js dist/prettify-ts-plus-plus.vsix
      - uses: actions/upload-artifact@v6
        with:
          name: prettify-ts-plus-plus-vsix
          path: dist/prettify-ts-plus-plus.vsix
          if-no-files-found: error
